name: ios-device-ipa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    name: iOS unsigned device IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Check the project definition exists
        run: ls -l ios/PhoneBox/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios/PhoneBox
        run: xcodegen generate

      - name: Build the device app (unsigned)
        working-directory: ios/PhoneBox
        run: |
          xcodebuild \
            -project PhoneBox.xcodeproj \
            -scheme PhoneBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check the binary architecture (must be arm64)
        working-directory: ios/PhoneBox
        run: |
          lipo -info build/Build/Products/Release-iphoneos/PhoneBox.app/PhoneBox | tee /tmp/arch.txt
          grep -q "arm64" /tmp/arch.txt
          ! grep -q "simulator" /tmp/arch.txt
          ! grep -q "x86_64" /tmp/arch.txt

      - name: Package the unsigned IPA
        working-directory: ios/PhoneBox
        run: |
          set -eu
          APP=build/Build/Products/Release-iphoneos/PhoneBox.app
          rm -rf Payload PhoneBox-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PhoneBox-unsigned.ipa Payload
          ls -lh PhoneBox-unsigned.ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phonebox-ios-unsigned-ipa
          path: ios/PhoneBox/PhoneBox-unsigned.ipa
          if-no-files-found: error
